name: Build and Package MSI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      product_version:
        description: 'Version del producto MSI (ej. 0.1.1)'
        required: false
        default: '0.1.1'

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Empaquetar MSI
    # Runner self-hosted en la red corporativa: necesario para firmar con la CA
    # interna (AD CS) y acceder a su infraestructura. Requiere las etiquetas
    # [self-hosted, windows] registradas en la organizacion/repositorio.
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar WiX Toolset CLI 4.0.6
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6

      - name: Asegurar binario de FFmpeg (WmvCoreHost.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "src/ScreenRecorder.UI/WmvCoreHost.exe")) {
            Write-Host "Descargando FFmpeg para empaquetado..."
            $zipPath = "$env:TEMP\ffmpeg.zip"
            $extractPath = "$env:TEMP\ffmpeg_extracted"
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
            $ffmpegExe = Get-ChildItem -Path $extractPath -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($ffmpegExe) {
              Copy-Item $ffmpegExe.FullName "src/ScreenRecorder.UI/WmvCoreHost.exe" -Force
              Write-Host "FFmpeg copiado como WmvCoreHost.exe con éxito"
            } else {
              throw "No se pudo encontrar ffmpeg.exe en el archivo descargado"
            }
            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
            Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Binario WmvCoreHost.exe ya presente en el entorno."
          }

      - name: Preparar certificado de firma (si existe)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host "Sin secreto SIGNING_PFX_BASE64: el MSI se generara SIN firmar."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "SIGNING_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Certificado de firma preparado."

      - name: Compilar y Empaquetar MSI
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ver = "${{ github.event.inputs.product_version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.1.1" }
          if ("${{ github.ref }}" -match '^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)') {
            $ver = $Matches[1]
          }
          Write-Host "Compilando instalador MSI con version: $ver"
          if ($env:SIGNING_PFX_PATH) {
            Write-Host "Firma con certificado de la CA interna (AD CS)."
            ./build-msi.ps1 -ProductVersion $ver -PfxPath $env:SIGNING_PFX_PATH -PfxPassword $env:SIGNING_PFX_PASSWORD
          } else {
            Write-Host "AVISO: sin certificado de firma."
            ./build-msi.ps1 -ProductVersion $ver
          }

      - name: Limpiar certificado de firma
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_PFX_PATH -and (Test-Path $env:SIGNING_PFX_PATH)) {
            Remove-Item -Force $env:SIGNING_PFX_PATH
          }

      - name: Subir artefacto MSI
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-MSI
          path: dist/*.msi
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true

